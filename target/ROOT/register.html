<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FYP Authentication System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(15, 15, 19, 0.65), rgba(15, 15, 19, 0.75)),
                url('/images/gtr.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-group input.valid {
            border-color: #27ae60;
        }

        .input-group input.invalid {
            border-color: #e74c3c;
        }

        /* Password strength */
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s;
            width: 0%;
        }

        .strength-text {
            font-size: 12px;
            margin-top: 4px;
        }

        .strength-weak .strength-fill {
            background: #e74c3c;
            width: 33%;
        }

        .strength-medium .strength-fill {
            background: #f39c12;
            width: 66%;
        }

        .strength-strong .strength-fill {
            background: #27ae60;
            width: 100%;
        }

        .strength-weak ~ .strength-text {
            color: #e74c3c;
        }

        .strength-medium ~ .strength-text {
            color: #f39c12;
        }

        .strength-strong ~ .strength-text {
            color: #27ae60;
        }

        .match-text {
            font-size: 12px;
            margin-top: 4px;
        }

        .match-ok {
            color: #27ae60;
        }

        .match-no {
            color: #e74c3c;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="register-container">
        <div class="header">
            <h2>Create Account</h2>
            <p>Register an account for CarMart</p>
        </div>

        <div id="message" class="message"></div>

        <form action="/register" method="post" id="registerForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3">
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required>
                <div class="strength-bar" id="strength-bar">
                    <div class="strength-fill"></div>
                </div>
                <div class="strength-text" id="strength-text"></div>
            </div>
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Repeat your password" required>
                <div class="match-text" id="match-text"></div>
            </div>
            <button type="submit" class="register-btn" id="submit-btn">Register</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login.html">Login here</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const msg = document.getElementById('message');

            if (error === 'empty') {
                msg.textContent = 'Please fill in all fields';
                msg.className = 'message error show';
            } else if (error === 'exists') {
                msg.textContent = 'Username already taken';
                msg.className = 'message error show';
            } else if (error === 'system') {
                msg.textContent = 'System error. Please try again.';
                msg.className = 'message error show';
            }

            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirm-password');
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');
            const matchText = document.getElementById('match-text');
            const submitBtn = document.getElementById('submit-btn');

            // Password strength checker
            passwordInput.addEventListener('input', function () {
                const val = this.value;
                let strength = 0;
                if (val.length >= 8) strength++;
                if (/[A-Z]/.test(val)) strength++;
                if (/[0-9]/.test(val)) strength++;
                if (/[^A-Za-z0-9]/.test(val)) strength++;

                strengthBar.className = 'strength-bar';
                if (val.length === 0) {
                    strengthText.textContent = '';
                } else if (strength <= 1) {
                    strengthBar.classList.add('strength-weak');
                    strengthText.textContent = 'Weak password';
                } else if (strength <= 2) {
                    strengthBar.classList.add('strength-medium');
                    strengthText.textContent = 'Medium password';
                } else {
                    strengthBar.classList.add('strength-strong');
                    strengthText.textContent = 'Strong password ✓';
                }
                checkMatch();
            });

            // Confirm password match checker
            confirmInput.addEventListener('input', checkMatch);

            function checkMatch() {
                const pass = passwordInput.value;
                const confirm = confirmInput.value;
                if (confirm.length === 0) {
                    matchText.textContent = '';
                    confirmInput.className = '';
                    return;
                }
                if (pass === confirm) {
                    matchText.textContent = '✓ Passwords match';
                    matchText.className = 'match-text match-ok';
                    confirmInput.classList.remove('invalid');
                    confirmInput.classList.add('valid');
                    submitBtn.disabled = false;
                } else {
                    matchText.textContent = '✗ Passwords do not match';
                    matchText.className = 'match-text match-no';
                    confirmInput.classList.remove('valid');
                    confirmInput.classList.add('invalid');
                    submitBtn.disabled = true;
                }
            }

            // Prevent form submit if passwords don't match
            document.getElementById('registerForm').addEventListener('submit', function (e) {
                if (passwordInput.value !== confirmInput.value) {
                    e.preventDefault();
                    matchText.textContent = 'Passwords do not match';
                    matchText.className = 'match-text match-no';
                }
            });
        });
    </script>
</body>

</html>
