# Render.com Blueprint — CarMart
# Deploy docs: https://render.com/docs/blueprint-spec

services:
  # ── Web App (Tomcat + Java) ──────────────────────────────────────────
  - type: web
    name: carmart-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free           # Free tier — spins down after 15min inactivity
    healthCheckPath: /login.html

    envVars:
      # ── Clever Cloud MySQL ─────────────────────────────────────────────
      # Copy these values from Clever Cloud add-on dashboard
      - key: MYSQL_ADDON_HOST
        sync: false      # Set manually in Render dashboard
      - key: MYSQL_ADDON_PORT
        value: "3306"
      - key: MYSQL_ADDON_DB
        sync: false
      - key: MYSQL_ADDON_USER
        sync: false
      - key: MYSQL_ADDON_PASSWORD
        sync: false

      # ── Cloudinary (free image storage) ──────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── App ───────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
