# Render.com Blueprint — CarMart
# Deploy docs: https://render.com/docs/blueprint-spec

services:
  # ── Web App (Tomcat + Java) ──────────────────────────────────────────
  - type: web
    name: carmart-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free           # Free tier — spins down after 15min inactivity
    healthCheckPath: /login.html

    envVars:
      # ── Database (Clever Cloud external MySQL — free) ─────────────────
      - key: DB_URL
        sync: false      # Set manually in Render dashboard
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ── Cloudinary (free image storage) ──────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── App ───────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
